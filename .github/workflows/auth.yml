name: API e app
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe PHP
        run: for f in api/src/*.php api/public/*.php; do php -l "$f"; done
      - name: Docker Compose válido
        run: cp .env.example .env && sed -i "s/^APP_SECRET=.*/APP_SECRET=$(openssl rand -hex 32)/" .env && docker compose config -q
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
