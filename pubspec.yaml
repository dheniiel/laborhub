name: laborhub
description: "Aplicativo LaborHub - Um aplicativo mobile para conectar prestadores de serviços com cliente."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  image_picker: ^1.2.4
  mask_text_input_formatter: ^2.9.0
  path_provider: ^2.1.6
  bcrypt: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/Assets/Images/

fonts:
  - family: MontSerrat
    fonts:
      - asset: 'lib/Assets/Fonts/MontSerrat/MontSerrat-Regular.ttf'
        weight: 400
      - asset: 'lib/Assets/Fonts/MontSerrat/MontSerrat-Bold.ttf'
        weight: 700
